name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  check-and-test:
    name: check-and-test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins current stable; the msrv leg overrides it
      # with the rust-version declared in Cargo.toml.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        if: matrix.toolchain == 'msrv'
        run: rustup toolchain install "${{ steps.msrv.outputs.msrv }}" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'msrv' && steps.msrv.outputs.msrv || '' }}
      - run: cargo clippy --all-targets -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'msrv' && steps.msrv.outputs.msrv || '' }}
      - run: cargo clippy --workspace -- -D warnings
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'msrv' && steps.msrv.outputs.msrv || '' }}
      - run: cargo test --workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain == 'msrv' && steps.msrv.outputs.msrv || '' }}

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: sh -n install.sh
      - run: shellcheck install.sh scripts/test-install.sh
      - run: scripts/test-install.sh

  build-release:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cross-build
        with:
          target: ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/patok --version
      - name: Check static linkage
        if: contains(matrix.target, 'musl')
        run: |
          out=$(ldd target/${{ matrix.target }}/release/patok 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qE 'not a dynamic executable|statically linked'
