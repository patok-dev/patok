[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 0.0.0 in source; the release job rewrites it from the tag.
version = "0.0.0"
edition = "2024"
# MSRV: latest stable minus two releases.
rust-version = "1.96"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
insta = "1"
prost = "0.14"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs", "sync", "time", "signal"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
protoc-bin-vendored = "3"
schemars = { version = "1", features = ["derive"] }

patok-core = { path = "crates/patok-core" }
patok-engine = { path = "crates/patok-engine" }
patok-proto = { path = "crates/patok-proto" }
patok-providers = { path = "crates/patok-providers" }
patok-tui = { path = "crates/patok-tui" }
