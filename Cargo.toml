[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# 0.0.0 in source; the release job rewrites it from the tag (spec Part IX).
version = "0.0.0"
edition = "2024"
# MSRV: latest stable minus two releases (spec Part X, section 1).
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
